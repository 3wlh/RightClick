name: Package macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 包版本（留空则使用当天日期，如 26.11.08；tag 触发时使用 tag）
        required: false
        type: string
      configuration:
        description: Swift/Xcode build configuration
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package macOS (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact_suffix: arm64
          - runner: macos-15-intel
            artifact_suffix: x86_64

    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'release' }}
      RIGHTCLICKPRO_VERSION: ${{ inputs.version || '' }}
      RIGHTCLICKPRO_PACKAGE_DMG: "1"
      RIGHTCLICKPRO_MACOS_DEPLOYMENT_TARGET: "14.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ARTIFACT_SUFFIX: ${{ matrix.artifact_suffix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Print toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            exit 0
          fi
          if [[ -z "${RIGHTCLICKPRO_VERSION}" ]]; then
            echo "RIGHTCLICKPRO_VERSION=$(TZ=Asia/Shanghai date +%y.%m.%d)" >> "$GITHUB_ENV"
          fi

      - name: Run Swift checks
        run: scripts/ci-swift-check.sh "$BUILD_CONFIGURATION"

      - name: Package macOS artifact
        run: scripts/package-macos.sh "$BUILD_CONFIGURATION"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: RightClick-${{ env.ARTIFACT_SUFFIX }}-${{ env.RIGHTCLICKPRO_VERSION || github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -maxdepth 1 -type f -print

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(release-assets/*.dmg)
          if (( ${#assets[@]} == 0 )); then
            echo "No DMG assets downloaded from package jobs." >&2
            exit 66
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="${GITHUB_REF_NAME}"
            prerelease=()
            create_target=(--verify-tag)
          else
            version="${INPUT_VERSION:-$(TZ=Asia/Shanghai date +%y.%m.%d)}"
            tag="v${version}"
            prerelease=(--prerelease)
            create_target=(--target "${GITHUB_SHA}")
          fi

          notes_file="$(mktemp)"
          {
            printf 'RightClick %s preview build.\n\n' "$version"
            printf 'Release DMG assets are built by GitHub Actions from %s.\n' "${GITHUB_REF_NAME}"
          } > "$notes_file"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              "${create_target[@]}" \
              "${prerelease[@]}" \
              --title "RightClick ${version}" \
              --notes-file "$notes_file"
          fi
